name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zephyr-i2c-tiny-usb-bridge
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephyr-i2c-tiny-usb-bridge
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ubuntu-24.04

      - name: Build firmware
        working-directory: zephyr-i2c-tiny-usb-bridge
        run: |
          west twister -T app -v --inline-logs --integration

      - name: Build firmware for boards without twister metadata
        working-directory: zephyr-i2c-tiny-usb-bridge
        run: |
          west build -p -b stm32_debug_probe -d build/stm32_debug_probe app
          west build -p -b stm32_debug_probe -d build/stm32_debug_probe_debug app -- \
            -DFILE_SUFFIX=debug
          west build -p -b stm32_debug_probe -d build/stm32_debug_probe_dfu --sysbuild app

      - name: Run tests
        working-directory: zephyr-i2c-tiny-usb-bridge
        run: |
          west twister -T tests -v --inline-logs --integration

      - name: Print ccache stats
        run: |
          ccache -s -vv
